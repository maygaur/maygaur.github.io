<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NemoTest</title>
<meta name="theme-color" content="#7c3aed">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%237c3aed'/%3E%3Ctext x='50' y='68' font-size='55' text-anchor='middle' fill='white'%3E%F0%9F%93%9D%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#f5f3ff; --card:#ffffff; --text:#1e1b2e; --muted:#6b6480;
    --accent:#7c3aed; --accent-dark:#6d28d9; --good:#16a34a; --goodbg:#dcfce7;
    --bad:#dc2626; --badbg:#fee2e2; --border:#e9e5f9;
    --partial:#b45309; --partialbg:#fef3c7;
    --shadow:0 1px 3px rgba(60,40,110,.08), 0 8px 24px rgba(60,40,110,.06);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#150f24; --card:#1e1733; --text:#ede9fe; --muted:#a49cc4;
      --accent:#a78bfa; --accent-dark:#8b5cf6; --good:#4ade80; --goodbg:#123321;
      --bad:#f87171; --badbg:#3a1414; --border:#332a54;
      --partial:#fbbf24; --partialbg:#3a2e0a;
      --shadow:0 1px 3px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    }
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--text); padding-bottom:40px;}
  .wrap{max-width:560px; margin:0 auto; padding:16px;}
  header{padding:20px 4px 10px; text-align:center;}
  header h1{font-size:22px; margin:0 0 2px;}
  header .sub{color:var(--muted); font-size:13px;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:18px; margin-bottom:14px; box-shadow:var(--shadow);}
  .qnum{font-size:12px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px;}
  .qtext{font-size:16px; font-weight:600; margin-bottom:12px; line-height:1.4;}
  .ans-row{display:flex; gap:8px;}
  .ans-row input{flex:1; padding:12px; border-radius:10px; border:1px solid var(--border);
    background:var(--bg); color:var(--text); font-size:15px;}
  .ans-row button{padding:12px 18px; border-radius:10px; border:none; background:var(--accent);
    color:#fff; font-weight:700; font-size:14px; cursor:pointer;}
  .ans-row button:disabled{opacity:.5; cursor:default;}
  .mic-btn{padding:12px 14px !important; background:var(--card) !important; color:var(--accent) !important;
    border:1px solid var(--border) !important; font-size:16px !important; line-height:1;}
  .mic-btn.listening{background:var(--bad) !important; color:#fff !important; border-color:var(--bad) !important;
    animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.55;}}
  .feedback{margin-top:10px; padding:10px 12px; border-radius:10px; font-size:13.5px; font-weight:600; display:none;}
  .feedback.correct{display:block; background:var(--goodbg); color:var(--good);}
  .feedback.incorrect{display:block; background:var(--badbg); color:var(--bad);}
  .feedback.partial{display:block; background:var(--partialbg); color:var(--partial);}
  .feedback .closeness{display:block; font-weight:400; margin-top:3px; opacity:.85;}
  .diff-section{margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); display:none;}
  .diff-line{font-size:13.5px; margin-bottom:6px; line-height:1.7; word-break:break-word;}
  .diff-tag{display:inline-block; font-size:10px; font-weight:700; text-transform:uppercase;
    letter-spacing:.03em; color:var(--muted); margin-right:6px; min-width:74px; vertical-align:middle;}
  .ch-match{background:var(--goodbg); color:var(--good); border-radius:3px;}
  .ch-miss-given{background:var(--badbg); color:var(--bad); border-radius:3px; text-decoration:line-through; text-decoration-thickness:1.5px;}
  .ch-miss-correct{background:var(--partialbg); color:var(--partial); border-radius:3px;}
  .diff-legend{font-size:11px; color:var(--muted); margin-top:2px;}
  .diff-legend span{display:inline-block; padding:0 5px; border-radius:3px; margin-right:4px;}
  .score-card{position:sticky; top:12px; text-align:center; z-index:5;}
  .score-big{font-size:32px; font-weight:800; color:var(--accent);}
  .score-label{color:var(--muted); font-size:12.5px;}
  .empty{text-align:center; color:var(--muted); padding:30px 10px; font-size:14px;}
  footer{text-align:center; font-size:11px; color:var(--muted); margin-top:20px;}
  a.admin-link{color:var(--muted); text-decoration:underline;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📝 NemoTest</h1>
    <div class="sub">Answer each question, hit Check, see how you did</div>
  </header>

  <div class="card score-card" id="scoreCard" style="display:none;">
    <div class="score-big" id="scoreBig">0 / 0</div>
    <div class="score-label">questions correct so far</div>
    <div class="score-big" id="scoreAvg" style="font-size:20px; margin-top:8px;">— / 10</div>
    <div class="score-label">average closeness score</div>
  </div>

  <div id="quizContent">
    <div class="card empty">Loading questions…</div>
  </div>

  <footer><a class="admin-link" href="admin.html">admin</a></footer>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDy6Zu4weC0IsDCrQ20FYC-OOxnXw_21vQ",
  authDomain: "water-intake-beca8.firebaseapp.com",
  projectId: "water-intake-beca8",
  storageBucket: "water-intake-beca8.firebasestorage.app",
  messagingSenderId: "1060774876551",
  appId: "1:1060774876551:web:1eae13fb2aa3d2e028af22"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

function normalize(s){
  return String(s || "").trim().toLowerCase().replace(/\s+/g, " ");
}

// ---------- voice input (Web Speech API) ----------
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
function attachMic(inputEl, mountEl){
  if (!SpeechRec || !mountEl) return; // not supported (e.g. iOS Safari) — no button shown
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "mic-btn";
  btn.textContent = "🎤";
  btn.title = "Speak your answer";
  let recognizing = false;
  let recognition;
  btn.onclick = (e) => {
    e.preventDefault();
    if (recognizing){ recognition.stop(); return; }
    recognition = new SpeechRec();
    recognition.lang = "en-US";
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    recognition.onstart = () => { recognizing = true; btn.classList.add("listening"); btn.textContent = "●"; };
    recognition.onend = () => { recognizing = false; btn.classList.remove("listening"); btn.textContent = "🎤"; };
    recognition.onerror = () => { recognizing = false; btn.classList.remove("listening"); btn.textContent = "🎤"; };
    recognition.onresult = (ev) => {
      const transcript = ev.results[0][0].transcript;
      inputEl.value = (inputEl.value.trim() ? inputEl.value.trim() + " " : "") + transcript;
      inputEl.focus();
    };
    recognition.start();
  };
  mountEl.appendChild(btn);
}

const contentEl = document.getElementById("quizContent");
const scoreCardEl = document.getElementById("scoreCard");
const scoreBigEl = document.getElementById("scoreBig");
const scoreAvgEl = document.getElementById("scoreAvg");

let results = {}; // qid -> { correct: bool, score10: number }

// ---------- closeness scoring (0-10) ----------
function levenshtein(a, b){
  const m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  const dp = new Array(n + 1);
  for (let j = 0; j <= n; j++) dp[j] = j;
  for (let i = 1; i <= m; i++){
    let prev = dp[0];
    dp[0] = i;
    for (let j = 1; j <= n; j++){
      const tmp = dp[j];
      dp[j] = a[i-1] === b[j-1]
        ? prev
        : 1 + Math.min(prev, dp[j], dp[j-1]);
      prev = tmp;
    }
  }
  return dp[n];
}
function closenessScore(given, correct){
  const a = normalize(given), b = normalize(correct);
  if (!a && !b) return 10;
  if (!a || !b) return 0;
  if (a === b) return 10;
  const dist = levenshtein(a, b);
  const sim = 1 - dist / Math.max(a.length, b.length);
  return Math.max(0, Math.min(10, Math.round(sim * 10)));
}

// ---------- character-level match diff (for the color-coded comparison) ----------
function lcsCharMask(a, b){ // a, b: arrays of lowercase chars
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, () => new Uint16Array(n + 1));
  for (let i = 1; i <= m; i++){
    for (let j = 1; j <= n; j++){
      dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1] + 1 : Math.max(dp[i-1][j], dp[i][j-1]);
    }
  }
  const matchA = new Array(m).fill(false);
  const matchB = new Array(n).fill(false);
  let i = m, j = n;
  while (i > 0 && j > 0){
    if (a[i-1] === b[j-1]){ matchA[i-1] = true; matchB[j-1] = true; i--; j--; }
    else if (dp[i-1][j] >= dp[i][j-1]) i--;
    else j--;
  }
  return { matchA, matchB };
}
function escapeChar(ch){
  const d = document.createElement("div");
  d.textContent = ch;
  return d.innerHTML === "" ? "&nbsp;" : d.innerHTML; // preserve visible spaces
}
function buildDiffHtml(given, correct){
  const g = given.trim() ? Array.from(given) : [];
  const c = correct.trim() ? Array.from(correct) : [];
  const { matchA, matchB } = lcsCharMask(g.map(ch => ch.toLowerCase()), c.map(ch => ch.toLowerCase()));
  const givenHtml = g.map((ch, i) =>
    `<span class="${matchA[i] ? 'ch-match' : 'ch-miss-given'}">${escapeChar(ch)}</span>`).join("") || '<span class="ch-miss-given">(no answer given)</span>';
  const correctHtml = c.map((ch, i) =>
    `<span class="${matchB[i] ? 'ch-match' : 'ch-miss-correct'}">${escapeChar(ch)}</span>`).join("");
  return { givenHtml, correctHtml };
}

function updateScore(){
  const entries = Object.values(results);
  const total = entries.length;
  const correct = entries.filter(r => r.correct).length;
  scoreBigEl.textContent = `${correct} / ${total}`;
  const avg = total ? entries.reduce((s, r) => s + r.score10, 0) / total : 0;
  scoreAvgEl.textContent = `${avg.toFixed(1)} / 10`;
}

async function loadQuestions(){
  let snap;
  try {
    snap = await getDocs(query(collection(db, "nemo_questions"), orderBy("createdAt", "asc")));
  } catch (e) {
    // orderBy can fail if field missing on some docs; fall back to unordered
    snap = await getDocs(collection(db, "nemo_questions"));
  }
  const questions = [];
  snap.forEach(d => questions.push({ id: d.id, ...d.data() }));

  if (questions.length === 0){
    contentEl.innerHTML = `<div class="card empty">No questions yet. Ask an admin to add some on the <a class="admin-link" href="admin.html">admin page</a>.</div>`;
    return;
  }

  scoreCardEl.style.display = "block";
  contentEl.innerHTML = questions.map((q, i) => `
    <div class="card" data-qid="${q.id}">
      <div class="qnum">Question ${i+1} of ${questions.length}</div>
      <div class="qtext">${escapeHtml(q.question)}</div>
      <div class="ans-row">
        <input type="text" placeholder="Your answer" id="ans_${q.id}">
        <span id="mic_${q.id}"></span>
        <button id="check_${q.id}">Check</button>
      </div>
      <div class="feedback" id="fb_${q.id}"></div>
      <div class="diff-section" id="diff_${q.id}"></div>
    </div>
  `).join("");

  questions.forEach(q => {
    const input = document.getElementById(`ans_${q.id}`);
    const btn = document.getElementById(`check_${q.id}`);
    const fb = document.getElementById(`fb_${q.id}`);
    const diffEl = document.getElementById(`diff_${q.id}`);
    attachMic(input, document.getElementById(`mic_${q.id}`));
    const submit = () => {
      if (btn.disabled) return;
      const isCorrect = normalize(input.value) === normalize(q.answer);
      const score10 = closenessScore(input.value, q.answer);
      results[q.id] = { correct: isCorrect, score10 };
      const cls = isCorrect ? "correct" : (score10 >= 5 ? "partial" : "incorrect");
      fb.className = "feedback " + cls;
      const mainLine = isCorrect ? "✓ Correct!" : `✗ Not quite — correct answer: ${escapeHtml(q.answer)}`;
      fb.innerHTML = `${mainLine}<span class="closeness">Closeness score: ${score10} / 10</span>`;

      const { givenHtml, correctHtml } = buildDiffHtml(input.value, q.answer);
      diffEl.innerHTML = `
        <div class="diff-line"><span class="diff-tag">You wrote</span>${givenHtml}</div>
        <div class="diff-line"><span class="diff-tag">Correct answer</span>${correctHtml}</div>
        <div class="diff-legend">
          <span class="ch-match">matched</span><span class="ch-miss-given">wrong/extra</span><span class="ch-miss-correct">missed</span>
        </div>
      `;
      diffEl.style.display = "block";

      input.disabled = true;
      btn.disabled = true;
      updateScore();
    };
    btn.onclick = submit;
    input.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
  });
}

function escapeHtml(s){
  const d = document.createElement("div");
  d.textContent = String(s || "");
  return d.innerHTML;
}

loadQuestions();
</script>
</body>
</html>
